<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Plain mark: a shield for the KYC surfaces, in the app's own theme colour
       (#1a3a4a, the theme-color already declared in index.html). SVG rather
       than .ico so it stays editable text in the repo and scales cleanly. -->
  <rect width="64" height="64" rx="12" fill="#1a3a4a"/>
  <path d="M32 13l15 6v13c0 11-6.4 17.6-15 21-8.6-3.4-15-10-15-21V19l15-6z"
        fill="none" stroke="#7fd1c1" stroke-width="4" stroke-linejoin="round"/>
  <path d="M24.5 32.5l5.5 5.5 10-11" fill="none" stroke="#7fd1c1"
        stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
